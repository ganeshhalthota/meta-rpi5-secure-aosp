image_name: rpi5-uboot-aosp
partition_scheme: gpt
sdcard_size: "24576"
partitions:
  - name: boot        # p1 — RPi firmware + U-Boot + kernel + ramdisk
    size: "256"
    format: fat32
    flags: boot
    img: out/target/product/rpi5/boot.img
    extra_files:
      - src: u-boot/u-boot.bin
        dst: u-boot.bin
      - src: config.txt
        content: |
          # Raspberry Pi 5 boot configuration
          # Load U-Boot
          kernel=u-boot.bin
          # GPU memory
          gpu_mem=256

  - name: misc        # p2 — Android misc (bootloader communication)
    size: "4"
    format: raw

  - name: userdata    # p3 — /data  (fstab: mmcblk0p3)
    size: "16384"
    format: ext4

  - name: cache       # p4 — placeholder to push system/vendor/metadata to p5/p6/p7
    size: "256"
    format: ext4

  - name: system      # p5 — /system  (fstab: mmcblk0p5)
    size: "4096"
    format: ext4
    img: out/target/product/rpi5/system.img

  - name: vendor      # p6 — /vendor  (fstab: mmcblk0p6)
    size: "512"
    format: ext4
    img: out/target/product/rpi5/vendor.img

  - name: metadata    # p7 — /metadata  (fstab: mmcblk0p7)
    size: "16"
    format: ext4
