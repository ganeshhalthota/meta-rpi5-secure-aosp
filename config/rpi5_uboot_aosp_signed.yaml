# RPi5 Secure AOSP Build Configuration

aosp:
  tag: android-16.0.0_r4
  manifest_url: https://android.googlesource.com/platform/manifest
  local_manifests:
    - url: https://raw.githubusercontent.com/ganeshhalthota/android_local_manifest/android-16.0.0_r4/manifest_brcm_rpi.xml
      filename: manifest_brcm_rpi.xml
    - url: https://raw.githubusercontent.com/ganeshhalthota/android_local_manifest/android-16.0.0_r4/remove_projects.xml
      filename: remove_projects.xml

uboot:
  # Keep full flow pinned to known-good RPi5 U-Boot revision.
  dir: u-boot-rpi5
  repo_url: https://github.com/u-boot/u-boot.git
  ref: eefb822fb574e28d49fc9f358328854e17fc8406

avb:
  private_key: avb/avb_private_key.pem
  public_key: avb/avb_public_key.bin
  sign_algorithm: SHA256_RSA4096
  hash_algorithm: sha256
  uboot_fail_policy: fail_closed

sdcard:
  config: sdcard/uboot_aosp.yaml
  sign_config: sdcard/uboot_aosp_signed.yaml
  enable_signing: true
